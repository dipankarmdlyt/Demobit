<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fill whole background for secure mask cropping -->
  <rect width="512" height="512" fill="#09090b" />
  
  <!-- Outer Glow Arc scaled with appropriate padding inside safe zone -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="15 30" opacity="0.3" />

  <!-- Stylized Geometric Moss Seed Symbol matching padding limits -->
  <g transform="translate(256, 256) scale(0.8)">
    <!-- Central Hex Leaf Core -->
    <path d="M 0 -105 L 90 -53 L 90 53 L 0 105 L -90 53 L -90 -53 Z" fill="url(#coreGlow)" opacity="0.15" />
    <path d="M 0 -100 L 86 -50 L 86 50 L 0 100 L -86 50 L -86 -50 Z" fill="none" stroke="#10b981" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Central Tech-Core Circle -->
    <circle cx="0" cy="0" r="40" fill="#020617" stroke="#34d399" stroke-width="8" />
    <circle cx="0" cy="0" r="12" fill="#10b981" />
    
    <!-- Diagonal Spines -->
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="0" x2="86" y2="50" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-86" y2="50" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
    
    <!-- Additional Leaf Node Accents -->
    <circle cx="0" cy="-100" r="16" fill="#10b981" />
    <circle cx="86" cy="50" r="16" fill="#10b981" />
    <circle cx="-86" cy="50" r="16" fill="#10b981" />
  </g>

  <!-- Gradients -->
  <defs>
    <radialGradient id="coreGlow" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#022c22" />
    </radialGradient>
  </defs>
</svg>
